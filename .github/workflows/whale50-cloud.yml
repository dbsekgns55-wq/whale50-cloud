
name: Whale50 Cloud Collector and Website

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * 1-5'
    - cron: '37 2 * * 0,6'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: whale50-cloud
  cancel-in-progress: false

jobs:
  collect-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Collect data
        env:
          WHALE50_SEC_EMAIL: ${{ secrets.WHALE50_SEC_EMAIL }}
        run: python cloud_run.py

      - name: Save history
        run: |
          git config user.name 'whale50-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/whale50.sqlite3 site
          if ! git diff --cached --quiet; then
            git commit -m 'Update Whale50 data'
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
