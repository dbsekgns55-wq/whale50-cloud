

name: Whale50 Cloud Collector and Website

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: whale50-cloud
  cancel-in-progress: false

jobs:
  collect-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    env:
      WHALE50_SEC_EMAIL: ${{ secrets.WHALE50_SEC_EMAIL }}
      WHALE50_ALPACA_KEY_ID: ${{ secrets.WHALE50_ALPACA_KEY_ID }}
      WHALE50_ALPACA_SECRET_KEY: ${{ secrets.WHALE50_ALPACA_SECRET_KEY }}
      WHALE50_ALPACA_FEED: iex
      WHALE50_MARKET_PROVIDER: alpaca

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Check required files and Alpaca secrets
        shell: bash
        run: |
          if [[ ! -f cloud_run.py || ! -f whale50_alpaca.py || ! -f whale50.py ]]; then
            echo '::error::Whale50 V4.4 files are missing from repository root.'
            exit 1
          fi
          if [[ -z "$WHALE50_ALPACA_KEY_ID" || -z "$WHALE50_ALPACA_SECRET_KEY" ]]; then
            echo '::error::Missing Alpaca GitHub Secrets.'
            exit 1
          fi
          echo 'Alpaca credentials are configured (values hidden).'

      - name: Collect data and validate predictions
        run: python cloud_run.py

      - name: Save history to repository
        shell: bash
        run: |
          git config user.name 'whale50-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/whale50.sqlite3 site
          if ! git diff --cached --quiet; then
            git commit -m 'Update Whale50 dataset and predictions'
            if ! git push origin HEAD:main; then
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort
                echo '::error::History conflict. Run workflow again.'
                exit 1
              fi
              git push origin HEAD:main
            fi
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website files
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4


